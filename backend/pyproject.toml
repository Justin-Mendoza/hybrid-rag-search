[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "hybrid-rag-search-api"
version = "0.1.0"
description = "API for Hybrid RAG Search"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "cohere>=5.21.1,<6",
  "dramatiq[redis]>=2,<3",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "markdown-it-py>=4.2,<5",
  "pydantic-settings>=2.7,<3",
  "pypdf>=6.19,<7",
  "redis>=6,<7",
  "sqlalchemy[asyncio]>=2.0,<3",
  "tokenizers>=0.23,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = ["mypy>=1.14,<2", "pre-commit>=4,<5", "pytest>=8.3,<9", "pytest-cov>=6,<7", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/hybrid_rag_search"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -m 'not integration and not live' --cov=hybrid_rag_search --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]
markers = [
  "integration: requires the migrated local PostgreSQL database",
  "live: makes explicitly authorized calls to an external provider",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["hybrid_rag_search"]
