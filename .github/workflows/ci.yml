name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://hybrid_rag:ci-only@localhost:5432/hybrid_rag
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_DB: hybrid_rag
          POSTGRES_PASSWORD: ci-only
          POSTGRES_USER: hybrid_rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hybrid_rag -d hybrid_rag"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e 'backend[dev]'
      - run: ruff format --check backend
      - run: ruff check backend
      - run: mypy backend/src
      - run: pytest backend
      - run: alembic --config backend/alembic.ini upgrade head
      - run: alembic --config backend/alembic.ini check
      - run: alembic --config backend/alembic.ini downgrade base
      - run: alembic --config backend/alembic.ini upgrade head
      - run: python -m hybrid_rag_search.seed
      - run: python -m hybrid_rag_search.seed
      - run: pytest backend -m integration --no-cov
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run format:check
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
